name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # Deploys the Supabase edge function (accounts, approvals, records API).
  # Needs the SUPABASE_ACCESS_TOKEN repository secret; skipped when it is missing.
  deploy-edge-function:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: gfbagczwhvxxstbfrfhu
    steps:
      - name: Checkout
        if: env.SUPABASE_ACCESS_TOKEN != ''
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        if: env.SUPABASE_ACCESS_TOKEN != ''
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy make-server-49c0e13c
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          # The app calls the function as make-server-49c0e13c; its source lives in functions/server.
          cp -r supabase/functions/server supabase/functions/make-server-49c0e13c
          supabase functions deploy make-server-49c0e13c --project-ref "$SUPABASE_PROJECT_ID" --use-api

      - name: Skipped (no SUPABASE_ACCESS_TOKEN secret)
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: echo "::warning::SUPABASE_ACCESS_TOKEN secret not set - edge function was not deployed."

  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps

      - name: Build
        run: |
          npx vite build 2>&1 | tee build.log || true
          echo "### Vite Build Output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ ! -d "./dist" ]; then exit 1; fi
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
