name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --include=dev --include=optional

      - name: Build
        run: |
          npx vite build 2>&1 | tee build.log || {
            echo "=== BUILD ERROR LOG ==="
            cat build.log
            git config user.name "isaacrow"
            git config user.email "106313576+isaacrow@users.noreply.github.com"
            cp build.log build_error.txt
            git add build_error.txt
            git commit -m "ci: capture build error log"
            git push origin main
            exit 1
          }
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
